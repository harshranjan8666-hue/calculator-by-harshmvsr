<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator by HarshMVSR</title>
<style>
:root{--bg:#0b0e15;--panel:#151a25;--key:#292f3b;--accent:#5875ff;--text:#f4f6ff;--muted:#9ba5ba}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 25%,#18203a 0,#0b0e15 52%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(18px,4vw,56px);border-bottom:1px solid #ffffff12;background:#0b0e15bb;gap:16px}
.brand{font-size:clamp(18px,2.4vw,25px);font-weight:750;letter-spacing:-.5px}.brand span,.hero h1 span{color:#7188ff}
nav{display:flex;gap:22px;color:var(--muted);font-size:14px}nav a{color:inherit;text-decoration:none}nav a:hover{color:white}
main{width:min(100% - 28px,640px);margin:44px auto 28px;text-align:center}
.logo{font-size:35px;color:#7188ff;margin-bottom:12px}
h1{font-size:clamp(28px,5vw,43px);letter-spacing:-1.2px;margin:0 0 10px}
.tagline{color:var(--muted);margin:0 0 28px;letter-spacing:.5px}
.calculator{background:linear-gradient(145deg,#171c28,#11151e);border:1px solid #ffffff0c;border-radius:24px;padding:22px;box-shadow:0 22px 70px #0006}
.display{height:112px;background:#0c1018;border:1px solid #303747;border-radius:15px;margin-bottom:18px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;overflow:hidden}
.expression{color:var(--muted);font-size:16px;min-height:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#screen{font-size:clamp(30px,7vw,43px);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{border:0;border-radius:13px;background:var(--key);color:var(--text);min-height:62px;font-size:22px;font-weight:550;cursor:pointer;transition:transform .12s,filter .12s,background .12s}
button:hover{filter:brightness(1.17)}button:active{transform:scale(.96)}
button.operator,button.equals{background:linear-gradient(135deg,#6983ff,#4d68f2)}button.utility{background:#343b49}button.zero{grid-column:span 2}
footer{color:var(--muted);font-size:14px;margin:28px 0 0}footer span{color:#7188ff}
@media(max-width:430px){header{padding:16px}nav{gap:12px;font-size:12px}.calculator{padding:14px;border-radius:19px}.keys{gap:8px}button{min-height:56px;border-radius:11px}.display{height:100px}}
</style>
</head>
<body>
<header>
  <div class="brand">▦ Calculator by <span>harshmvsr</span></div>
  <nav><a href="#home">Home</a><a href="#calculator">Calculator</a><a href="#about">About</a></nav>
</header>
<main id="home">
  <div class="logo">▦</div>
  <h1>Calculator by <span>harshmvsr</span></h1>
  <p class="tagline">Simple&nbsp; • &nbsp;Fast&nbsp; • &nbsp;Reliable</p>
  <section class="calculator" id="calculator" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div class="expression" id="expression">Ready to calculate</div>
      <div id="screen">0</div>
    </div>
    <div class="keys">
      <button class="utility" data-action="clear">C</button>
      <button class="utility" data-action="sign">+/−</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-op="/">÷</button>
      <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="operator" data-op="*">×</button>
      <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button class="operator" data-op="-">−</button>
      <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button class="operator" data-op="+">+</button>
      <button class="zero" data-num="0">0</button><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
    </div>
  </section>
  <footer id="about">Made with <span>♥</span> by harshmvsr</footer>
</main>
<script>
const screen=document.getElementById('screen'), expression=document.getElementById('expression');
let current='0', previous=null, operator=null, shouldReset=false;
function render(){screen.textContent=current}
function format(n){if(!Number.isFinite(n))return 'Error';return String(Number(n.toPrecision(12)))}
function calculate(a,b,op){if(op==='+')return a+b;if(op==='-')return a-b;if(op==='*')return a*b;if(op==='/')return b===0?NaN:a/b;return b}
function inputDigit(d){if(current==='Error'||shouldReset){current=d;shouldReset=false}else if(current==='0'){current=d}else if(current.length<16){current+=d}render()}
function chooseOperator(op){if(current==='Error')return;const value=Number(current);if(operator&& !shouldReset){const r=calculate(previous,value,operator);current=format(r);render();previous=Number(current)}else{previous=value}operator=op;shouldReset=true;expression.textContent=format(previous)+' '+({'+' :'+','-':'−','*':'×','/':'÷'}[op]);}
function equals(){if(operator===null||previous===null||current==='Error')return;const a=previous,b=Number(current),op=operator;const r=calculate(a,b,op);expression.textContent=format(a)+' '+({'+' :'+','-':'−','*':'×','/':'÷'}[op])+' '+format(b)+' =';current=format(r);previous=null;operator=null;shouldReset=true;render()}
function clearAll(){current='0';previous=null;operator=null;shouldReset=false;expression.textContent='Ready to calculate';render()}
document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.num!==undefined){inputDigit(b.dataset.num);return}if(b.dataset.op){chooseOperator(b.dataset.op);return}switch(b.dataset.action){case'clear':clearAll();break;case'equals':equals();break;case'decimal':if(current==='Error'||shouldReset){current='0.';shouldReset=false}else if(!current.includes('.'))current+='.';render();break;case'sign':if(current!=='0'&&current!=='Error')current=String(-Number(current));render();break;case'percent':if(current!=='Error')current=format(Number(current)/100);render();break;}});
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))inputDigit(e.key);else if(['+','-','*','/'].includes(e.key))chooseOperator(e.key);else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='Escape')clearAll();else if(e.key==='.')document.querySelector('[data-action="decimal"]').click();});
</script>
</body>
</html>
